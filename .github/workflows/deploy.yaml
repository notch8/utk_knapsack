name: "Deploy"
# Ad-hoc deploys and rollbacks. Pushes to main, staging and production deploy from their
# Build Test Lint run instead.
run-name: Deploy (${{ github.ref_name }} -> ${{ inputs.environment }}) by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false


jobs:
  deploy:
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    uses: notch8/actions/.github/workflows/deploy.yaml@v1.0.12
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
