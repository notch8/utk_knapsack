name: Draft Release Notes

on:
  push:
    branches:
      - staging
      - production

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      IS_STAGING: ${{ github.ref_name == 'staging' }}
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: ${{ env.IS_STAGING == 'true' && 'release-drafter-staging.yml' || 'release-drafter.yml' }}
          commitish: ${{ github.ref_name }}
          prerelease: ${{ env.IS_STAGING }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
