# UTK promotes main straight to production, so a hotfix that lands on production merges back to main.
name: Auto-Merger

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: auto-merger-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  auto-merger:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the auto-merger app
        id: app
        env:
          APP_ID: ${{ secrets.AUTO_MERGER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTO_MERGER_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AUTO_MERGER_APP_ID or AUTO_MERGER_APP_PRIVATE_KEY is not set; skipping merge-down."
          fi

      # A GitHub App token lets CI run automatically on the PR this workflow creates.
      - name: Generate a token
        if: steps.app.outputs.configured == 'true'
        id: generate_token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.AUTO_MERGER_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGER_APP_PRIVATE_KEY }}

      - name: Check out the repository
        if: steps.app.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open or update merge-down pull request
        if: steps.app.outputs.configured == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const script = require('${{ github.workspace }}/.github/auto-merger.cjs')
            await script({ github, context })
