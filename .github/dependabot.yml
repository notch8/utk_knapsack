version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    # Paused 2026-10-13: Hyku bumps should come from Hyku `production`, not `main`, per the
    # agreed flow. Remove this line once the team settles how bumps work.
    open-pull-requests-limit: 0
    schedule:
      # A fixed calendar time. A "weekly" interval runs at a random time and can skip a Monday
      # when the config changed mid-week (2026-10-12).
      interval: "cron"
      cronjob: "0 6 * * 1" # Mondays 6am Pacific
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # A fixed calendar time. A "weekly" interval runs at a random time and can skip a Monday
      # when the config changed mid-week (2026-10-12).
      interval: "cron"
      cronjob: "0 6 * * 1" # Mondays 6am Pacific
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
