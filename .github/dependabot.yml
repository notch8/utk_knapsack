version: 2
# Hyku (hyrax-webapp) bumps come from .github/workflows/bump-hyku.yml instead, so they only
# open on Mondays or by hand.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
