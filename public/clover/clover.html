<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <base target="_top" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600,700" />
        <style>
          /* Clover inherits its text colour from this page, and every show theme frames the
             viewer in black, so a transparent page left the panel black on black. */
          :root { --colors-accent: #ff8200 !important; }
          html, body { margin: 0; height: 100%; background: #4b4b4b; color: #fff; color-scheme: dark; font-family: Montserrat, Helvetica, Arial, sans-serif; }
          #information-toggle span { color: #4b4b4b; opacity: 1; }
          #information-toggle[aria-checked="false"] { background-color: #a7a9ac; }
          #information-toggle:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
          [data-testid="information-panel-list"] { align-self: flex-start; width: fit-content; }
          [data-testid="information-panel-list"] [role="tab"][data-state] { font-weight: 600; }
          .content-search-form button[type="submit"] svg { fill: #4b4b4b; }
          .clover-viewer-information-panel a { color: #fff !important; text-decoration: underline; }
          clover-viewer { display: block; height: 100%; }
          clover-viewer :has(.clover-viewer-content) { height: 100% !important; }
          .clover-viewer-content { height: 100% !important; }
          .clover-viewer-player-wrapper,
          .clover-viewer-painting :has(> .clover-viewer-player-wrapper) { background-color: transparent !important; }
          .clover-viewer-information-panel { overflow-wrap: anywhere; }
          [data-testid="information-panel-cue"] strong { white-space: nowrap; margin-left: .75rem; }
          .clover-viewer-information-panel [data-testid="information-panel-cue"]:hover { color: #fff; box-shadow: inset 4px 0 #ff8200; }
          .clover-viewer-information-panel [data-testid="information-panel-cue"][aria-checked="true"] { background: #fff; color: #4b4b4b; box-shadow: inset 4px 0 #ff8200; }
          .clover-viewer-information-panel, .clover-viewer-information-panel * { box-sizing: border-box; }
          .clover-viewer-header > span:first-child { padding-left: 1rem !important; }
          .clover-viewer-header > div:last-child { padding-right: 1rem !important; }
          clover-viewer:not(:has(*)) { padding: 1rem; box-sizing: border-box; }
          .clover-viewer-content > div[data-aside-active] { padding: 0 1rem; box-sizing: border-box; }
          @media (max-width: 767px) { .clover-viewer-content > div[data-aside-active="true"] { padding: 0; } }
          .clover-viewer-media-wrapper figure img { object-fit: contain; }
          video.audio-only::cue { font-size: clamp(14px, 2.4vw, 24px); white-space: pre-line; }
          .captions-toggle {
            position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 1;
            padding: 4px 12px; border: 1px solid #fff; border-radius: 4px;
            background: #4b4b4b; color: #fff; font: 600 14px/1.4 Montserrat, Helvetica, Arial, sans-serif; cursor: pointer;
          }
          .captions-toggle[aria-pressed="true"] { background: #fff; color: #4b4b4b; }
          .captions-toggle:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        </style>
    </head>
    <body>
    <script type="text/javascript" src="clover.js"></script>
    <clover-viewer></clover-viewer>
    <script>
        const manifestUrl = new URLSearchParams(window.location.search).get('manifest');
        const viewer = document.querySelector('clover-viewer');
        // Clover takes the manifest URL from `id`, and setAttribute would stringify
        // a missing one to "null" rather than leaving it unset.
        if (manifestUrl) viewer.setAttribute('id', manifestUrl);

        // The web component cannot pass Clover the option to start with its information panel
        // closed, and Clover opens it once mounted, so close it whenever it opens until the
        // visitor uses the toggle themselves.
        const keepPanelClosed = new MutationObserver(() => {
          const toggle = document.getElementById('information-toggle');
          if (toggle?.getAttribute('aria-checked') === 'true') toggle.click();
        });
        keepPanelClosed.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['aria-checked'] });
        ['pointerdown', 'keydown', 'click'].forEach((type) => {
          document.addEventListener(type, (event) => {
            if (event.isTrusted && event.target.closest?.('#information-toggle')) keepPanelClosed.disconnect();
          }, true);
        });

        // OVERRIDE: liftAudioCaptions and the audio cue size come from samvera/hyku#3499, which this page shadows
        const CAPTION_CLEARANCE = 130;
        const liftAudioCaptions = (media) => {
          if (media.readyState < 1 || media.videoWidth > 0 || !media.clientHeight) return;
          const line = Math.max(0, 100 - (CAPTION_CLEARANCE / media.clientHeight) * 100);
          for (const track of media.textTracks) {
            for (const cue of track.cues || []) Object.assign(cue, { snapToLines: false, line });
          }
        };
        ['loadedmetadata', 'load'].forEach((type) => {
          document.addEventListener(type, (event) => {
            const media = event.target.closest?.('audio, video');
            if (media) liftAudioCaptions(media);
          }, true);
        });
        window.addEventListener('resize', () => document.querySelectorAll('audio, video').forEach(liftAudioCaptions));

        const captionsShowing = (media) => [...media.textTracks].some((track) => track.mode === 'showing');
        const captionsToggleFor = (media) => media.closest?.('.clover-viewer-player-wrapper')?.querySelector('.captions-toggle');
        const syncCaptionsToggle = (media) => {
          const button = captionsToggleFor(media);
          if (!button) return;
          button.hidden = !media.textTracks.length;
          button.setAttribute('aria-pressed', String(captionsShowing(media)));
        };

        const watchedMedia = new WeakSet();
        document.addEventListener('loadstart', (event) => {
          const media = event.target;
          if (!media.textTracks) return;
          captionsToggleFor(media)?.remove();
          if (watchedMedia.has(media)) return;
          watchedMedia.add(media);
          ['change', 'addtrack', 'removetrack'].forEach((type) => {
            media.textTracks.addEventListener(type, () => {
              liftAudioCaptions(media);
              syncCaptionsToggle(media);
            });
          });
        }, true);

        document.addEventListener('loadedmetadata', (event) => {
          const media = event.target;
          if (!media.textTracks) return;
          media.classList.toggle('audio-only', !media.videoWidth);
          const wrapper = media.closest('.clover-viewer-player-wrapper');
          if (!wrapper || media.videoWidth > 0 || captionsToggleFor(media)) return;
          const button = document.createElement('button');
          Object.assign(button, { type: 'button', className: 'captions-toggle', textContent: 'CC', title: 'Captions' });
          button.addEventListener('click', () => {
            const turnOn = !captionsShowing(media);
            [...media.textTracks].forEach((track, index) => { track.mode = turnOn && index === 0 ? 'showing' : 'disabled'; });
            syncCaptionsToggle(media);
          });
          wrapper.appendChild(button);
          syncCaptionsToggle(media);
        }, true);
    </script>
    </body>
</html>
