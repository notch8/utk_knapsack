worker:
  resources:
    limits:
      memory: "6Gi"
      cpu: "1000m"
    requests:
      memory: "3Gi"
      cpu: "100m"
  replicaCount: 2
  extraVolumeMounts: *volMounts
  extraEnvVars: *envVars
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: hyrax-worker
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: "OnRootMismatch"
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: "OnRootMismatch"

embargoRelease:
  enabled: false
leaseRelease:
  enabled: false

fcrepo:
  enabled: false

postgresql:
  enabled: false
  pool: 10
redis:
  master:
    resources:
      limits:
        memory: "512Mi"
        cpu: "100m"
      requests:
        memory: "256Mi"
        cpu: "20m"
  image:
    repository: bitnamilegacy/redis
    tag: 7.0.2-debian-11-r7
  enabled: true
  architecture: standalone
  auth:
    password: $REDIS_PASSWORD
solr:
  enabled: false
# The default loadSolrConfigSet hardcodes the path to the Solr configset, and doesn't allow for overrides
# Since this application is using Solr 9, it needs to use an updated Solr configset at the knapsack path
loadSolrConfigSet: false
# Unlike extraEnvVars, extraInitContainers is rendered with plain toYaml (not the chart's templating
# helper), so {{ }} expressions here get written to the manifest as literal text - use resolved values.
extraInitContainers:
  - name: load-solr-config
    image: "ghcr.io/$REPO_LOWER/web:$TAG"
    imagePullPolicy: IfNotPresent
    env:
      - name: SOLR_ADMIN_USER
        value: admin
      - name: SOLR_ADMIN_PASSWORD
        value: $SOLR_ADMIN_PASSWORD
      - name: SOLR_COLLECTION_NAME
        value: utk-knapsack-production
      - name: SOLR_CONFIGSET_NAME
        value: utk-knapsack-production
      - name: SOLR_HOST
        value: solr.solr
      - name: SOLR_PORT
        value: "8983"
    command:
      - sh
      - -c
      - >
        solrcloud-upload-configset.sh /app/samvera/solr/conf &&
        solrcloud-assign-configset.sh
