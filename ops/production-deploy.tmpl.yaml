replicaCount: 3

resources:
  limits:
    memory: "4Gi"
    cpu: "1250m"
  requests:
    memory: "2Gi"
    cpu: "250m"

# Chart default path "/" does a full Solr+DB-backed page render - too slow/heavy for a health check. /healthz (okcomputer, mounted by Hyrax's own config/initializers/1_healthz.rb) is cheap and dependency-free. Same config as utk-hyku production.
startupProbe:
  enabled: true
  path: "/healthz"
  failureThreshold: 30
livenessProbe:
  enabled: true
  path: "/healthz"
  initialDelaySeconds: 15
  periodSeconds: 60
  timeoutSeconds: 60
  failureThreshold: 6
readinessProbe:
  enabled: true
  path: "/healthz"
  initialDelaySeconds: 15
  periodSeconds: 60
  timeoutSeconds: 60
  failureThreshold: 6

# No commonLabels/podLabels in this chart, so podAnnotations is the only lever for tying pods to the project/environment.
podAnnotations:
  project: utk-knapsack
  environment: production

# Prefer spreading web replicas across AZs; the default nodegroup spans all 3 but nothing does this automatically.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hyrax

# db-setup's migration-count check queries schema_migrations before db:create
# ever runs, so it dies under `set -e` against a genuinely empty database.
# Host/user/db are hardcoded, not $DB_HOST-style: this container gets no env
# from the chart, and envsubst blanks any $VARNAME with no matching CI secret.
dbPreSetupInitContainer:
  - name: ensure-schema-migrations
    image: "ghcr.io/$REPO_LOWER/web:$TAG"
    command:
      - sh
      - -c
      - PGPASSWORD=$DB_PASSWORD psql -h postgres-18-pooler.postgres.svc.cluster.local -p 5432 -U postgres utk_knapsack_production -c "CREATE TABLE IF NOT EXISTS schema_migrations (version character varying(255) NOT NULL PRIMARY KEY);"

brandingVolume:
  storageClass: aws-efs
derivativesVolume:
  storageClass: aws-efs
uploadsVolume:
  storageClass: aws-efs
  size: 200Gi

imagePullSecrets:
 - name: github

extraVolumeMounts: &volMounts
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/imports
    subPath: imports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/exports
    subPath: exports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/system
    subPath: public-system
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/uploads
    subPath: public-uploads
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/network_files
    subPath: network-files
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/storage/files
    subPath: storage-files

ingress:
  enabled: true
  ingressClassName: "nginx"
  hosts:
    - host: utk-knapsack-production.notch8.cloud
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: "*.utk-knapsack-production.notch8.cloud"
      paths:
        - path: /
          pathType: ImplementationSpecific
  annotations:
    nginx.org/client-max-body-size: "0"
    nginx.org/websocket-services: "utk-knapsack-production-nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production-dns"
  tls:
    - hosts:
        - utk-knapsack-production.notch8.cloud
        - "*.utk-knapsack-production.notch8.cloud"
      secretName: utk-knapsack-production-tls

