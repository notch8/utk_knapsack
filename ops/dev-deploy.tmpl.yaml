# This maps to the rancher friends cluster.

replicaCount: 2

resources:
  limits:
    memory: "4Gi"
    cpu: "1250m"
  requests:
    memory: "2Gi"
    cpu: "900m"

livenessProbe:
  enabled: false
readinessProbe:
  enabled: false

# db-setup's migration-count check queries schema_migrations before db:create
# ever runs, so it dies under `set -e` against a genuinely empty database.
# Host/user/db are hardcoded, not $DB_HOST-style: this container gets no env
# from the chart, and envsubst blanks any $VARNAME with no matching CI secret.
dbPreSetupInitContainer:
  - name: ensure-schema-migrations
    image: "ghcr.io/$REPO_LOWER/web:$TAG"
    command:
      - sh
      - -c
      - PGPASSWORD=$DB_PASSWORD psql -h zalando-postgres-v14-pooler.postgres.svc.cluster.local -p 5432 -U postgres utk_knapsack_staging -c "CREATE TABLE IF NOT EXISTS schema_migrations (version character varying(255) NOT NULL PRIMARY KEY);"

brandingVolume:
  storageClass: aws-efs
derivativesVolume:
  storageClass: aws-efs
uploadsVolume:
  storageClass: aws-efs
  size: 200Gi

imagePullSecrets:
 - name: github

extraVolumeMounts: &volMounts
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/imports
    subPath: imports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/exports
    subPath: exports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/system
    subPath: public-system
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/uploads
    subPath: public-uploads
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/network_files
    subPath: network-files
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/storage/files
    subPath: storage-files

ingress:
  enabled: true
  ingressClassName: "nginx-ingress"
  hosts:
    - host: utk-knapsack-dev.notch8.cloud
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: "*.utk-knapsack-dev.notch8.cloud"
      paths:
        - path: /
          pathType: ImplementationSpecific
  annotations:
    nginx.org/client-max-body-size: "0"
    nginx.org/websocket-services: "utk-knapsack-dev-nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production-dns"
  tls:
    - hosts:
        - utk-knapsack-dev.notch8.cloud
        - "*.utk-knapsack-dev.notch8.cloud"
      secretName: utk-knapsack-dev-tls

extraEnvVars: &envVars
  - name: BUNDLE_DISABLE_LOCAL_BRANCH_CHECK
    value: "true"
  - name: BUNDLE_LOCAL__HYKU_KNAPSACK
    value: /app/samvera
  - name: CLIENT_ADMIN_USER_EMAIL
    value: $CLIENT_ADMIN_USER_EMAIL
  - name: CLIENT_ADMIN_USER_PASSWORD
    value: $CLIENT_ADMIN_USER_PASSWORD
  - name: CONFDIR
    value: "/app/samvera/hyrax-webapp/solr/conf"
  - name: DB_ADAPTER
    value: postgresql
  - name: DB_HOST
    value: zalando-postgres-v14-pooler.postgres.svc.cluster.local
  - name: DB_NAME
    value: utk_knapsack_staging
  - name: DB_USER
    value: postgres
  - name: PGSSLMODE
    value: require
  - name: DB_PREPARED_STATEMENTS
    value: "false"
  - name: DB_ADVISORY_LOCKS
    value: "false"
  - name: DISABLE_ANALYTICS_FEATURES
    value: "false"
  - name: GOOGLE_ANALYTICS_ID
    value: $GOOGLE_ANALYTICS_ID
  - name: GOOGLE_ANALYTICS_PROPERTY_ID
    value: "$GOOGLE_ANALYTICS_PROPERTY_ID"
  - name: GOOGLE_ACCOUNT_JSON
    value: $GOOGLE_ACCOUNT_JSON
  - name: HYKU_ADMIN_HOST
    value: utk-knapsack-dev.notch8.cloud
  - name: HYKU_ADMIN_ONLY_TENANT_CREATION
    value: "false"
  - name: HYKU_ALLOW_SIGNUP
    value: "false"
  - name: HYKU_BLOCK_VALKYRIE_REDIRECT
    value: "true"
  - name: HYKU_BULKRAX_ENABLED
    value: "true"
  - name: HYKU_CONTACT_EMAIL
    value: support@notch8.com
  - name: HYKU_DEFAULT_HOST
    value: "%{tenant}.utk-knapsack-dev.notch8.cloud"
  - name: HYKU_FILE_ACL
    value: "true"
  - name: HYKU_USER_DEFAULT_PASSWORD
    value: $HYKU_USER_DEFAULT_PASSWORD
  - name: HYKU_VOCABULARY_SIDEBAR_ENABLED
    value: "true"
  - name: HYKU_MULTITENANT
    value: "true"
  - name: HYKU_ROOT_HOST
    value: utk-knapsack-dev.notch8.cloud
  - name: HYKU_SHOW_BACKTRACE
    value: "true"
  - name: HYRAX_ACTIVE_JOB_QUEUE
    value: good_job
  - name: HYRAX_ANALYTICS
    value: "false"
  - name: HYRAX_FITS_PATH
    value: /app/fits/fits.sh
  - name: HYRAX_FLEXIBLE
    value: "true"
  - name: HYRAX_REDIRECTS_ENABLED
    value: "true"
  - name: HYRAX_SKIP_WINGS
    value: "true"
  - name: HYRAX_VALKYRIE
    value: "true"
  - name: IN_DOCKER
    value: "true"
  - name: INITIAL_ADMIN_EMAIL
    value: admin@example.com
  - name: INITIAL_ADMIN_PASSWORD
    value: $INITIAL_ADMIN_PASSWORD
  - name: LD_LIBRARY_PATH
    value: /app/fits/tools/mediainfo/linux
  - name: NEGATIVE_CAPTCHA_SECRET
    value: $NEGATIVE_CAPTCHA_SECRET
  - name: RAILS_CACHE_STORE_URL
    value: redis://:$REDIS_PASSWORD@utk-knapsack-dev-redis-master:6379/0
  # do not change this value
  - name: RAILS_ENV
    value: production
  - name: RAILS_LOG_TO_STDOUT
    value: "true"
  - name: RAILS_MAX_THREADS
    value: "7"
  - name: RAILS_SERVE_STATIC_FILES
    value: "true"
  - name: REDIS_HOST
    value: utk-knapsack-dev-redis-master
  - name: REDIS_URL
    value: redis://:$REDIS_PASSWORD@utk-knapsack-dev-redis-master:6379/0
  - name: SENTRY_DSN
    value: $SENTRY_DSN
  - name: SENTRY_ENVIRONMENT
    value: $SENTRY_ENVIRONMENT
  - name: SMTP_ADDRESS
    value: "maildev-smtp.maildev.svc.cluster.local"
  - name: SMTP_DOMAIN
    value: "maildev-smtp.maildev.svc.cluster.local"
  - name: SMTP_ENABLED
    value: "true"
  - name: SMTP_PORT
    value: "1025"
  - name: SMTP_TYPE
    value: "plain"
  - name: SMTP_USER_NAME
    value: "admin"
  - name: SMTP_STARTTLS
    value: "false"
  - name: SMTP_PASSWORD
    value: $SMTP_PASSWORD
  - name: SOLR_ADMIN_PASSWORD
    value: $SOLR_ADMIN_PASSWORD
  - name: SOLR_ADMIN_USER
    value: admin
  - name: SOLR_COLLECTION_NAME
    value: utk-knapsack-dev
  - name: SOLR_COLLECTION_REPLICAS
    value: "3"
  - name: SOLR_CONFIGSET_NAME
    value: utk-knapsack-dev
  - name: SOLR_HOST
    value: solr.solr
  - name: SOLR_PORT
    value: "8983"
  - name: SOLR_URL
    value: http://admin:$SOLR_ADMIN_PASSWORD@solr.solr:8983/solr/
  - name: TEST_USER_EMAIL
    value: user@example.com
  - name: TEST_USER_PASSWORD
    value: $TEST_USER_PASSWORD
  - name: VALKYRIE_ID_TYPE
    value: string

worker:
  resources:
    limits:
      memory: "6Gi"
      cpu: "1000m"
    requests:
      memory: "3Gi"
      cpu: "100m"
  replicaCount: 1
  extraVolumeMounts: *volMounts
  extraEnvVars: *envVars
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: "OnRootMismatch"
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: "OnRootMismatch"

embargoRelease:
  enabled: false
leaseRelease:
  enabled: false

fcrepo:
  enabled: false

postgresql:
  enabled: false
  pool: 10
redis:
  master:
    resources:
      limits:
        memory: "512Mi"
        cpu: "100m"
      requests:
        memory: "256Mi"
        cpu: "20m"
  image:
    repository: bitnamilegacy/redis
    tag: 7.0.2-debian-11-r7
  enabled: true
  architecture: standalone
  auth:
    password: $REDIS_PASSWORD
solr:
  enabled: false
fits:
  enabled: true
  servicePort: 8080
  subPath: /fits
  resources:
    limits:
      memory: "2Gi"
      cpu: "1000m"
    requests:
      memory: "1Gi"
      cpu: "250m"
  livenessProbe:
    initialDelaySeconds: 60
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 60
    failureThreshold: 6
externalPostgresql:
  host: zalando-postgres-v14-pooler.postgres.svc.cluster.local
  username: postgres
  database: utk_knapsack_staging
  password: $DB_PASSWORD

externalSolrHost: solr.solr.svc.cluster.local
externalSolrUser: admin
externalSolrCollection: "utk-knapsack-dev"
externalSolrPassword: $SOLR_ADMIN_PASSWORD

nginx:
  enabled: true
  service:
    type: ClusterIP
  image:
    repository: "ghcr.io/$REPO_LOWER/nginx"
    tag: "$TAG"
  # sane default server block (keepalive, open_file_cache, hoisted proxy headers, asset paths) comes from the chart; below is only what this app adds on top
  extraHttpConfig: |-
    
    map ${DOLLAR}status ${DOLLAR}loggable {
        ~^444  0;
        default 1;
    }

    log_format loki 'host=${DOLLAR}host ip=${DOLLAR}http_x_forwarded_for remote_user=${DOLLAR}remote_user [${DOLLAR}time_local] '
                      'request="${DOLLAR}request" status=${DOLLAR}status bytes=${DOLLAR}body_bytes_sent '
                      'referer="${DOLLAR}http_referer" agent="${DOLLAR}http_user_agent" request_time=${DOLLAR}request_time upstream_response_time=${DOLLAR}upstream_response_time upstream_response_length=${DOLLAR}upstream_response_length';

    # Cloudflare ips see for refresh
    # https://support.cloudflare.com/hc/en-us/articles/200170786-Restoring-original-visitor-IPs-logging-visitor-IP-addresses
    # update list https://www.cloudflare.com/ips/
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
  accessLogFormat: loki
